<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Photography Portfolio</h1>
        <p>A simple gallery hosted on GitHub Pages.</p>
    </header>

    <!-- To add images easily, just put your images in an "images" folder 
         and copy/paste one of the img lines below! -->
    <main class="gallery">
        <img src="images/photo1.jpg" alt="Description of photo 1">
        <img src="images/photo2.jpg" alt="Description of photo 2">
        <img src="images/photo3.jpg" alt="Description of photo 3">
        <!-- ADD NEW IMAGES HERE -->
        <!-- <img src="images/your-new-photo.jpg" alt="New photo"> -->
    </main>

    <footer>
        <p>&copy; 2026 My Name</p>
    </footer>

</body>
</html>
